xt x="36" y="218" font-size="18" font-weight="700" fill="#e6edf3">Role           <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">Hardware & Embedded Systems Engineer</tspan></text></g><g class="row" style="animation-delay: 0.56s"><text x="36" y="262" font-size="18" font-weight="700" fill="#facc15">Focus          <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">Digital System Design · ASIC/FPGA · ML & CV</tspan></text></g><g class="row" style="animation-delay: 0.68s"><text x="36" y="306" font-size="18" font-weight="700" fill="#fb923c">Silicon / EDA  <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">SystemVerilog · Yosys · OpenROAD · KLayout</tspan></text></g><g class="row" style="animation-delay: 0.80s"><text x="36" y="350" font-size="18" font-weight="700" fill="#c084fc">FPGA & CAD     <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">Intel Quartus Prime · Altium · SolidWorks</tspan></text></g><g class="row" style="animation-delay: 0.92s"><text x="36" y="394" font-size="18" font-weight="700" fill="#60a5fa">Software & ML  <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">Python · C++ · TensorFlow · OpenCV · Docker</tspan></text></g><g class="row" style="animation-delay: 1.04s"><text x="36" y="438" font-size="18" font-weight="700" fill="#39d353">RISC CPU       <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">16-bit Pipelined RISC CPU (ASIC Tapeout Flow)</tspan></text></g><g class="row" style="animation-delay: 1.16s"><text x="36" y="482" font-size="18" font-weight="700" fill="#38bdf8">Accelerators   <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">FPGA CNN Hardware Matrix/Multiplier Cores</tspan></text></g><g class="row" style="animation-delay: 1.28s"><text x="36" y="526" font-size="18" font-weight="700" fill="#e6edf3">Robotics       <tspan fill="#7d8590">: </tspan><tspan fill="#e6edf3" font-weight="400">Multi-Axi